<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>物品詳情 — 校園失物協尋 v3</title>
  <style>
    :root { --bg:#0f172a; --surface:#1e293b; --surface2:#273349; --border:#334155; --primary:#7c3aed; --primary-light:#a78bfa; --primary-glow:rgba(124,58,237,0.25); --text:#f1f5f9; --muted:#94a3b8; --lost:#fb923c; --found:#34d399; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Helvetica Neue',Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    header { background:var(--surface); border-bottom:1px solid var(--border); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
    .header-title { font-size:17px; font-weight:900; color:var(--primary-light); display:flex; align-items:center; gap:8px; }
    .nav-back { color:var(--muted); text-decoration:none; font-size:14px; font-weight:600; transition:color .2s; }
    .nav-back:hover { color:var(--primary-light); }

    .content { max-width:640px; margin:0 auto; padding:20px 16px 60px; }

    /* Glowing hero */
    .hero-card {
      border-radius:16px; padding:24px; margin-bottom:14px;
      position:relative; overflow:hidden;
      border:1px solid var(--border);
    }
    .hero-card.type-lost { background:linear-gradient(135deg, rgba(251,146,60,.12) 0%, var(--surface) 60%); border-color:rgba(251,146,60,.3); }
    .hero-card.type-found { background:linear-gradient(135deg, var(--primary-glow) 0%, var(--surface) 60%); border-color:rgba(124,58,237,.4); }
    .hero-bg-icon { position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:80px; opacity:.12; }
    .hero-badges { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .badge { padding:4px 12px; border-radius:20px; font-size:12px; font-weight:700; }
    .badge-lost { background:rgba(251,146,60,.15); color:var(--lost); border:1px solid rgba(251,146,60,.3); }
    .badge-found { background:rgba(52,211,153,.1); color:var(--found); border:1px solid rgba(52,211,153,.25); }
    .badge-cat { background:var(--surface2); color:var(--muted); border:1px solid var(--border); }
    .hero-title { font-size:28px; font-weight:900; margin-bottom:6px; line-height:1.2; }
    .hero-by { font-size:13px; color:var(--muted); }

    /* Status */
    .status-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .status-left { display:flex; align-items:center; gap:12px; }
    .status-orb {
      width:40px; height:40px; border-radius:50%;
      display:flex; align-items:center; justify-content:center; font-size:18px;
      flex-shrink:0;
    }
    .orb-searching { background:rgba(239,68,68,.15); box-shadow:0 0 16px rgba(239,68,68,.3); animation:pulse 2s infinite; }
    .orb-done { background:rgba(52,211,153,.12); box-shadow:0 0 16px rgba(52,211,153,.25); }
    @keyframes pulse { 0%,100%{box-shadow:0 0 16px rgba(239,68,68,.3)} 50%{box-shadow:0 0 24px rgba(239,68,68,.5)} }
    .status-text .label { font-size:12px; color:var(--muted); margin-bottom:2px; }
    .status-text .value { font-size:16px; font-weight:800; }
    .val-s { color:#f87171; }
    .val-d { color:var(--found); }

    .btn-toggle {
      padding:9px 16px; border:none; border-radius:10px;
      font-size:13px; font-weight:700; cursor:pointer; transition:.2s; flex-shrink:0;
    }
    .btn-td { background:rgba(52,211,153,.1); color:var(--found); border:1px solid rgba(52,211,153,.2); }
    .btn-td:hover { background:rgba(52,211,153,.2); }
    .btn-ts { background:rgba(239,68,68,.1); color:#f87171; border:1px solid rgba(239,68,68,.2); }
    .btn-ts:hover { background:rgba(239,68,68,.2); }

    /* Info */
    .info-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:14px; overflow:hidden; }
    .info-card-header { padding:12px 18px; border-bottom:1px solid var(--border); font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
    .info-item { display:flex; align-items:flex-start; gap:14px; padding:14px 18px; border-bottom:1px solid var(--border); }
    .info-item:last-child { border-bottom:none; }
    .ii-icon { font-size:22px; flex-shrink:0; }
    .ii-body .ii-label { font-size:12px; color:var(--muted); margin-bottom:3px; }
    .ii-body .ii-val { font-size:15px; color:var(--text); font-weight:500; line-height:1.5; }

    /* Contact */
    .contact-card {
      background:var(--primary-glow); border:1px solid rgba(124,58,237,.4);
      border-radius:14px; padding:20px; margin-bottom:14px;
      box-shadow:0 0 24px var(--primary-glow);
    }
    .contact-card h3 { font-size:12px; font-weight:800; color:var(--primary-light); text-transform:uppercase; letter-spacing:.5px; margin-bottom:10px; }
    .contact-val { font-size:20px; font-weight:900; color:var(--text); }
    .contact-hint { font-size:12px; color:var(--muted); margin-top:8px; }

    /* Not found */
    .not-found { text-align:center; padding:80px 20px; color:var(--muted); }
    .nf-emoji { font-size:52px; margin-bottom:12px; }
    .not-found a { color:var(--primary-light); text-decoration:none; }
  </style>
</head>
<body>
  <header>
    <div class="header-title">🔍 校園失物協尋</div>
    <a class="nav-back" href="index.html">← 返回列表</a>
  </header>

  <div class="content" id="main"></div>

  <script>
    const EMOJI = {'書本文具':'📚','3C電子':'💻','衣物配件':'👕','證件卡片':'🪪','餐具飲料':'🍱','其他':'📦'};
    const user = JSON.parse(localStorage.getItem('lf_current_user') || 'null');

    function getItem(id) { return (JSON.parse(localStorage.getItem('lf_items')||'[]')).find(i=>i.id==id)||null; }
    function saveItem(u) { const a=JSON.parse(localStorage.getItem('lf_items')||'[]'), i=a.findIndex(x=>x.id==u.id); if(i!==-1) a[i]=u; localStorage.setItem('lf_items',JSON.stringify(a)); }
    function toggleStatus(id) { const item=getItem(id); if(!item) return; item.status=item.status==='searching'?'done':'searching'; saveItem(item); render(id); }

    function render(id) {
      const item = getItem(id);
      const c = document.getElementById('main');
      if (!item) { c.innerHTML=`<div class="not-found"><div class="nf-emoji">🌌</div><div>找不到此物品</div><div style="margin-top:12px"><a href="index.html">← 返回首頁</a></div></div>`; return; }

      const isDone = item.status === 'done';
      const icon = EMOJI[item.category] || '📦';

      c.innerHTML = `
        <div class="hero-card type-${item.type}">
          <div class="hero-bg-icon">${icon}</div>
          <div class="hero-badges">
            <span class="badge badge-${item.type}">${item.type==='lost'?'😢 遺失物':'🎉 拾獲物'}</span>
            <span class="badge badge-cat">${item.category}</span>
          </div>
          <div class="hero-title">${item.title}</div>
          <div class="hero-by">發布者：${item.postedBy || '匿名'}</div>
        </div>

        <div class="status-card">
          <div class="status-left">
            <div class="status-orb ${isDone?'orb-done':'orb-searching'}">${isDone?'✅':'🔍'}</div>
            <div class="status-text">
              <div class="label">目前狀態</div>
              <div class="value ${isDone?'val-d':'val-s'}">${isDone?'已找到':'尋找中'}</div>
            </div>
          </div>
          ${user
            ? `<button class="btn-toggle ${isDone?'btn-ts':'btn-td'}" onclick="toggleStatus(${item.id})">${isDone?'改為尋找中':'標記為已找到 ✅'}</button>`
            : `<span style="font-size:12px;color:var(--muted)">登入後可更新狀態</span>`}
        </div>

        <div class="info-card">
          <div class="info-card-header">📋 物品資訊</div>
          <div class="info-item">
            <div class="ii-icon">📍</div>
            <div class="ii-body"><div class="ii-label">${item.type==='lost'?'遺失地點':'拾獲地點'}</div><div class="ii-val">${item.location}</div></div>
          </div>
          <div class="info-item">
            <div class="ii-icon">📅</div>
            <div class="ii-body"><div class="ii-label">${item.type==='lost'?'遺失時間':'拾獲時間'}</div><div class="ii-val">${item.time}</div></div>
          </div>
          ${item.desc?`
          <div class="info-item">
            <div class="ii-icon">📝</div>
            <div class="ii-body"><div class="ii-label">物品描述</div><div class="ii-val">${item.desc}</div></div>
          </div>`:'' }
        </div>

        <div class="contact-card">
          <h3>📞 聯絡方式</h3>
          <div class="contact-val">${item.contact}</div>
          <div class="contact-hint">請先確認是本人物品再聯絡，避免誤領</div>
        </div>
      `;
    }

    const id = new URLSearchParams(location.search).get('id');
    if (id) render(id);
    else document.getElementById('main').innerHTML = `<div class="not-found"><div class="nf-emoji">🌌</div><div>未指定物品</div><div style="margin-top:12px"><a href="index.html">← 返回首頁</a></div></div>`;
  </script>
</body>
</html>
