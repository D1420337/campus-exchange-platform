<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>發布物品 — 校園失物協尋 v3</title>
  <style>
    :root { --bg:#0f172a; --surface:#1e293b; --surface2:#273349; --border:#334155; --primary:#7c3aed; --primary-light:#a78bfa; --primary-glow:rgba(124,58,237,0.25); --text:#f1f5f9; --muted:#94a3b8; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Helvetica Neue',Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    header { background:var(--surface); border-bottom:1px solid var(--border); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
    .header-title { font-size:17px; font-weight:900; color:var(--primary-light); display:flex; align-items:center; gap:8px; }
    .nav-back { color:var(--muted); text-decoration:none; font-size:14px; font-weight:600; transition:color .2s; }
    .nav-back:hover { color:var(--primary-light); }

    .content { max-width:640px; margin:0 auto; padding:20px 16px 60px; }

    /* Type chooser */
    .type-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
    .type-card {
      background:var(--surface); border:2px solid var(--border);
      border-radius:14px; padding:18px 14px; text-align:center; cursor:pointer;
      transition:border-color .2s, background .2s, box-shadow .2s;
    }
    .type-card .tc-icon { font-size:36px; }
    .type-card .tc-title { font-size:14px; font-weight:800; color:var(--muted); margin-top:8px; }
    .type-card .tc-desc { font-size:12px; color:#475569; margin-top:3px; }
    .type-card.sel-lost { border-color:#fb923c; background:rgba(251,146,60,.08); box-shadow:0 0 16px rgba(251,146,60,.15); }
    .type-card.sel-lost .tc-title { color:#fb923c; }
    .type-card.sel-found { border-color:var(--primary); background:var(--primary-glow); box-shadow:0 0 16px var(--primary-glow); }
    .type-card.sel-found .tc-title { color:var(--primary-light); }

    /* Section */
    .section { background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:12px; overflow:hidden; }
    .section-header { padding:12px 18px; border-bottom:1px solid var(--border); font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; display:flex; align-items:center; gap:6px; }
    .section-body { padding:18px; }

    .form-row { display:grid; gap:14px; }
    .form-row.two { grid-template-columns:1fr 1fr; }
    @media(max-width:480px){ .form-row.two{grid-template-columns:1fr;} }

    .form-group { display:flex; flex-direction:column; gap:6px; }
    label { font-size:13px; font-weight:700; color:var(--muted); }
    .req { color:#f87171; }
    input, select, textarea {
      background:var(--bg); border:1.5px solid var(--border);
      border-radius:10px; padding:10px 14px; font-size:15px; color:var(--text);
      font-family:inherit; outline:none; transition:border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus, textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-glow); }
    input::placeholder, textarea::placeholder { color:#475569; }
    select option { background:var(--surface2); }
    textarea { resize:vertical; min-height:80px; }

    /* Photo */
    .photo-zone {
      border:2px dashed var(--border); border-radius:12px; padding:24px;
      text-align:center; cursor:pointer; transition:.2s; background:var(--bg);
    }
    .photo-zone:hover { border-color:var(--primary); background:var(--primary-glow); }
    .photo-zone input { display:none; }
    .pz-icon { font-size:32px; }
    .photo-zone p { font-size:14px; color:var(--muted); margin-top:8px; }
    #photo-preview { max-width:100%; max-height:180px; border-radius:10px; margin-top:12px; display:none; }

    /* Login warn */
    .login-warn { background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.3); border-radius:12px; padding:14px; margin-bottom:14px; text-align:center; font-size:14px; color:#fbbf24; }
    .login-warn a { color:var(--primary-light); font-weight:700; }

    /* Submit */
    .btn-submit { width:100%; padding:14px; background:var(--primary); color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:800; cursor:pointer; transition:background .2s, box-shadow .2s; }
    .btn-submit:hover { background:#6d28d9; box-shadow:0 0 24px var(--primary-glow); }
    .btn-submit:disabled { background:#4c1d95; opacity:.6; cursor:not-allowed; }
    .msg { font-size:14px; text-align:center; margin-top:10px; padding:8px; border-radius:8px; display:none; }
    .msg.error { background:rgba(239,68,68,.12); color:#f87171; border:1px solid rgba(239,68,68,.25); display:block; }
    .msg.success { background:rgba(52,211,153,.1); color:#6ee7b7; border:1px solid rgba(52,211,153,.2); display:block; }
  </style>
</head>
<body>
  <header>
    <div class="header-title">🔍 校園失物協尋</div>
    <a class="nav-back" href="index.html">← 取消</a>
  </header>

  <div class="content">
    <div class="login-warn" id="login-warn" style="display:none">⚠️ 請先 <a href="auth.html">登入或註冊</a> 才能發布物品</div>

    <div class="type-grid">
      <div class="type-card sel-lost" id="card-lost" onclick="selectType('lost')">
        <div class="tc-icon">😢</div>
        <div class="tc-title">我遺失了物品</div>
        <div class="tc-desc">協助找回失物</div>
      </div>
      <div class="type-card" id="card-found" onclick="selectType('found')">
        <div class="tc-icon">🎉</div>
        <div class="tc-title">我拾獲了物品</div>
        <div class="tc-desc">幫助物主找到物品</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">📋 物品資訊</div>
      <div class="section-body">
        <div class="form-row" style="margin-bottom:14px">
          <div class="form-group">
            <label>物品名稱 <span class="req">*</span></label>
            <input id="item-title" type="text" placeholder="例：黑色耳機、學生證" />
          </div>
        </div>
        <div class="form-row two" style="margin-bottom:14px">
          <div class="form-group">
            <label>物品分類 <span class="req">*</span></label>
            <select id="item-category">
              <option value="">— 請選擇 —</option>
              <option value="書本文具">📚 書本文具</option>
              <option value="3C電子">💻 3C 電子</option>
              <option value="衣物配件">👕 衣物配件</option>
              <option value="證件卡片">🪪 證件卡片</option>
              <option value="餐具飲料">🍱 餐具飲料</option>
              <option value="其他">📦 其他</option>
            </select>
          </div>
          <div class="form-group">
            <label>顏色 / 品牌</label>
            <input id="item-color" type="text" placeholder="例：黑色 Sony" />
          </div>
        </div>
        <div class="form-group">
          <label>物品描述</label>
          <textarea id="item-desc" placeholder="顏色、特徵、標記…越詳細越好"></textarea>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">📍 地點與時間</div>
      <div class="section-body">
        <div class="form-row two">
          <div class="form-group">
            <label>地點 <span class="req">*</span></label>
            <input id="item-location" type="text" placeholder="例：圖書館 3F" />
          </div>
          <div class="form-group">
            <label>時間 <span class="req">*</span></label>
            <input id="item-time" type="datetime-local" />
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">📷 照片（選填）</div>
      <div class="section-body">
        <div class="photo-zone" onclick="document.getElementById('photo-input').click()">
          <input type="file" id="photo-input" accept="image/*" onchange="previewPhoto(event)" />
          <div class="pz-icon">📷</div>
          <p>點此上傳照片</p>
        </div>
        <img id="photo-preview" alt="預覽" />
      </div>
    </div>

    <div class="section">
      <div class="section-header">📞 聯絡方式</div>
      <div class="section-body">
        <div class="form-group">
          <label>聯絡資訊 <span class="req">*</span></label>
          <input id="item-contact" type="text" placeholder="姓名 + 電話 / LINE / Email" />
        </div>
      </div>
    </div>

    <button class="btn-submit" id="submit-btn" onclick="submitPost()">✅ 發布物品</button>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    let selectedType = 'lost';
    const now = new Date();
    document.getElementById('item-time').value = new Date(now.getTime() - now.getTimezoneOffset()*60000).toISOString().slice(0,16);
    const user = JSON.parse(localStorage.getItem('lf_current_user') || 'null');
    if (user) document.getElementById('item-contact').value = user.name + (user.phone ? ' ' + user.phone : '');
    else document.getElementById('login-warn').style.display = 'block';

    function selectType(t) {
      selectedType = t;
      document.getElementById('card-lost').className = 'type-card' + (t==='lost' ? ' sel-lost' : '');
      document.getElementById('card-found').className = 'type-card' + (t==='found' ? ' sel-found' : '');
    }
    function previewPhoto(e) {
      const file = e.target.files[0]; if (!file) return;
      new FileReader().onload = ev => { const img = document.getElementById('photo-preview'); img.src = ev.target.result; img.style.display = 'block'; };
      const r = new FileReader(); r.onload = ev => { const img = document.getElementById('photo-preview'); img.src = ev.target.result; img.style.display = 'block'; }; r.readAsDataURL(file);
    }
    function showMsg(t,cls) { const el=document.getElementById('msg'); el.textContent=t; el.className='msg '+cls; }
    function submitPost() {
      if (!user) { showMsg('請先登入才能發布物品','error'); return; }
      const title=document.getElementById('item-title').value.trim(), category=document.getElementById('item-category').value,
            location=document.getElementById('item-location').value.trim(), timeVal=document.getElementById('item-time').value,
            contact=document.getElementById('item-contact').value.trim(), desc=document.getElementById('item-desc').value.trim(),
            color=document.getElementById('item-color').value.trim();
      if (!title) { showMsg('請填寫物品名稱','error'); return; }
      if (!category) { showMsg('請選擇物品分類','error'); return; }
      if (!location) { showMsg('請填寫地點','error'); return; }
      if (!contact) { showMsg('請填寫聯絡方式','error'); return; }
      const items = JSON.parse(localStorage.getItem('lf_items')||'[]');
      const nextId = parseInt(localStorage.getItem('lf_next_id')||'1');
      items.push({ id:nextId, type:selectedType, title, category, location, time:timeVal?timeVal.replace('T',' ').slice(0,16):'',
        desc:(color?'顏色/品牌：'+color+'\n':'')+desc, contact, status:'searching', postedBy:user.name });
      localStorage.setItem('lf_items', JSON.stringify(items));
      localStorage.setItem('lf_next_id', String(nextId+1));
      document.getElementById('submit-btn').disabled = true;
      showMsg('✅ 發布成功！即將跳轉…','success');
      setTimeout(()=>window.location.href='index.html', 1500);
    }
  </script>
</body>
</html>
