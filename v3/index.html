<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>首頁 — 校園失物協尋 v3</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #273349;
      --border: #334155;
      --primary: #7c3aed;
      --primary-light: #a78bfa;
      --primary-glow: rgba(124,58,237,0.25);
      --accent: #f59e0b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --lost-color: #fb923c;
      --found-color: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }

    /* ── LEFT SIDEBAR ── */
    .sidebar {
      width: 220px; flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0;
      z-index: 200;
      transition: transform .3s;
    }
    .sidebar-brand {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
    }
    .brand-name { font-size: 16px; font-weight: 900; color: var(--primary-light); display: flex; align-items: center; gap: 8px; }
    .brand-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }

    .sidebar-user {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--primary); display: flex; align-items: center;
      justify-content: center; font-size: 16px; flex-shrink: 0;
    }
    .user-info { min-width: 0; }
    .user-name { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-action { font-size: 11px; color: var(--muted); }
    .user-action a { color: var(--primary-light); text-decoration: none; }

    .sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
    .nav-section-title { font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; padding: 8px 8px 4px; }
    .nav-link {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 8px;
      color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600;
      margin-bottom: 2px; cursor: pointer; border: none; background: none; width: 100%; text-align: left;
      transition: background .15s, color .15s;
    }
    .nav-link:hover { background: var(--surface2); color: var(--text); }
    .nav-link.active { background: var(--primary-glow); color: var(--primary-light); }
    .nav-icon { font-size: 18px; width: 22px; text-align: center; }

    .sidebar-post {
      padding: 12px;
      border-top: 1px solid var(--border);
    }
    .btn-post {
      display: block; width: 100%; padding: 11px;
      background: var(--primary); color: #fff; border: none;
      border-radius: 10px; font-size: 14px; font-weight: 700;
      cursor: pointer; text-align: center; text-decoration: none;
      transition: background .2s, box-shadow .2s;
    }
    .btn-post:hover { background: #6d28d9; box-shadow: 0 0 16px var(--primary-glow); }

    /* Menu toggle (mobile) */
    .menu-toggle {
      display: none; position: fixed; top: 12px; left: 12px; z-index: 300;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; font-size: 18px; cursor: pointer; color: var(--text);
    }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 150; }

    /* ── MAIN ── */
    .main { flex: 1; margin-left: 220px; display: flex; flex-direction: column; min-width: 0; }

    /* Top bar */
    .topbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 12px 20px; display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 100;
    }
    .search-wrap { flex: 1; position: relative; max-width: 500px; }
    .search-wrap input {
      width: 100%; background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 9px 14px 9px 38px;
      color: var(--text); font-size: 14px; outline: none;
      transition: border-color .2s;
    }
    .search-wrap input:focus { border-color: var(--primary); }
    .search-wrap input::placeholder { color: var(--muted); }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 15px; }
    .topbar-filters { display: flex; gap: 8px; }
    .filter-pill {
      padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
      border: 1.5px solid var(--border); background: none; color: var(--muted);
      cursor: pointer; transition: .15s;
    }
    .filter-pill:hover { border-color: var(--primary-light); color: var(--primary-light); }
    .filter-pill.active { border-color: var(--primary); background: var(--primary-glow); color: var(--primary-light); }

    /* Content */
    .content-area { padding: 20px; flex: 1; }

    /* Stats row */
    .stats-row { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .stat-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 18px; display: flex; align-items: center; gap: 10px;
    }
    .stat-box .sb-icon { font-size: 22px; }
    .stat-box .sb-val { font-size: 20px; font-weight: 900; color: var(--text); }
    .stat-box .sb-label { font-size: 11px; color: var(--muted); margin-top: 1px; }

    /* Cards (masonry-ish 2 col) */
    .cards-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media(max-width: 600px) { .cards-col { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
      text-decoration: none; color: inherit; display: block;
      transition: border-color .2s, transform .15s, box-shadow .2s;
    }
    .card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 20px var(--primary-glow); }

    .card-top { padding: 14px 14px 10px; }
    .card-badges { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .badge-lost { background: rgba(251,146,60,.15); color: var(--lost-color); border: 1px solid rgba(251,146,60,.3); }
    .badge-found { background: rgba(52,211,153,.12); color: var(--found-color); border: 1px solid rgba(52,211,153,.25); }
    .badge-cat { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

    .card-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; line-height: 1.3; }
    .card-desc { font-size: 13px; color: var(--muted); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .card-meta { display: flex; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }

    .card-footer {
      border-top: 1px solid var(--border); padding: 8px 14px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .status-dot-row { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-searching { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,.5); animation: blink 1.5s infinite; }
    .dot-done { background: var(--found-color); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .card-icon { font-size: 22px; }

    .empty { text-align: center; padding: 60px 0; color: var(--muted); grid-column: 1/-1; }
    .empty-emoji { font-size: 48px; margin-bottom: 12px; }

    /* Mobile adjustments */
    @media(max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.open { display: block; }
      .main { margin-left: 0; }
      .menu-toggle { display: block; }
      .topbar { padding-left: 52px; }
    }
  </style>
</head>
<body>

  <!-- Mobile menu btn -->
  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
  <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-name">🔍 校園失物協尋</div>
      <div class="brand-sub">Campus Lost & Found</div>
    </div>

    <div class="sidebar-user" id="sidebar-user">
      <div class="user-avatar">👤</div>
      <div class="user-info">
        <div class="user-name" id="sidebar-username">尚未登入</div>
        <div class="user-action"><a href="auth.html">登入 / 註冊</a></div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-title">瀏覽</div>
      <a class="nav-link active" href="index.html"><span class="nav-icon">🏠</span>全部物品</a>
      <button class="nav-link" onclick="setTypeFilter('lost')"><span class="nav-icon">😢</span>遺失物</button>
      <button class="nav-link" onclick="setTypeFilter('found')"><span class="nav-icon">🎉</span>拾獲物</button>

      <div class="nav-section-title" style="margin-top:8px">分類</div>
      <button class="nav-link" onclick="setCatFilter('')"><span class="nav-icon">📋</span>全部分類</button>
      <button class="nav-link" onclick="setCatFilter('書本文具')"><span class="nav-icon">📚</span>書本文具</button>
      <button class="nav-link" onclick="setCatFilter('3C電子')"><span class="nav-icon">💻</span>3C 電子</button>
      <button class="nav-link" onclick="setCatFilter('衣物配件')"><span class="nav-icon">👕</span>衣物配件</button>
      <button class="nav-link" onclick="setCatFilter('證件卡片')"><span class="nav-icon">🪪</span>證件卡片</button>
      <button class="nav-link" onclick="setCatFilter('餐具飲料')"><span class="nav-icon">🍱</span>餐具飲料</button>
      <button class="nav-link" onclick="setCatFilter('其他')"><span class="nav-icon">📦</span>其他</button>
    </nav>

    <div class="sidebar-post">
      <a class="btn-post" href="post.html">＋ 發布物品</a>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <!-- Top bar -->
    <div class="topbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="搜尋物品名稱或地點…" oninput="renderCards()" />
      </div>
      <div class="topbar-filters">
        <button class="filter-pill active" data-status="" onclick="setStatusFilter(this)">全部</button>
        <button class="filter-pill" data-status="searching" onclick="setStatusFilter(this)">尋找中</button>
        <button class="filter-pill" data-status="done" onclick="setStatusFilter(this)">已找到</button>
      </div>
    </div>

    <div class="content-area">
      <!-- Stats -->
      <div class="stats-row" id="stats-row"></div>

      <!-- Cards -->
      <div class="cards-col" id="cards-col"></div>
    </div>
  </div>

  <script>
    const EMOJI = {'書本文具':'📚','3C電子':'💻','衣物配件':'👕','證件卡片':'🪪','餐具飲料':'🍱','其他':'📦'};
    let filterType = '', filterCat = '', filterStatus = '';

    function seedData() {
      if (localStorage.getItem('lf_seeded')) return;
      const items = [
        { id:1, type:'lost', category:'書本文具', title:'微積分課本', location:'圖書館 3F', time:'2026-03-24', desc:'藍色封面，第三版', status:'searching', contact:'王小明 0912-345-678', postedBy:'王小明' },
        { id:2, type:'found', category:'3C電子', title:'黑色耳機', location:'學生餐廳', time:'2026-03-24', desc:'Sony 黑色有線耳機', status:'searching', contact:'林小花 0987-654-321', postedBy:'林小花' },
        { id:3, type:'lost', category:'證件卡片', title:'學生證', location:'體育館', time:'2026-03-23', desc:'姓名已遮，卡面有一張可愛貼紙', status:'done', contact:'陳大海 0923-111-222', postedBy:'陳大海' },
        { id:4, type:'found', category:'衣物配件', title:'藍色連帽外套', location:'電梯旁椅子', time:'2026-03-22', desc:'L 號深藍色外套，右側口袋有鑰匙', status:'searching', contact:'張美雲 0956-333-444', postedBy:'張美雲' },
      ];
      localStorage.setItem('lf_items', JSON.stringify(items));
      localStorage.setItem('lf_next_id', '5');
      localStorage.setItem('lf_seeded', '1');
    }

    function getItems() { return JSON.parse(localStorage.getItem('lf_items') || '[]'); }

    function setTypeFilter(t) {
      filterType = filterType === t ? '' : t;
      renderCards();
    }
    function setCatFilter(c) { filterCat = c; renderCards(); }
    function setStatusFilter(el) {
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      filterStatus = el.dataset.status;
      renderCards();
    }

    function renderCards() {
      const q = document.getElementById('search-input').value.trim().toLowerCase();
      let items = getItems();

      document.getElementById('stats-row').innerHTML = `
        <div class="stat-box"><span class="sb-icon">📋</span><div><div class="sb-val">${items.length}</div><div class="sb-label">全部物品</div></div></div>
        <div class="stat-box"><span class="sb-icon">😢</span><div><div class="sb-val" style="color:var(--lost-color)">${items.filter(i=>i.type==='lost').length}</div><div class="sb-label">遺失物</div></div></div>
        <div class="stat-box"><span class="sb-icon">🎉</span><div><div class="sb-val" style="color:var(--found-color)">${items.filter(i=>i.type==='found').length}</div><div class="sb-label">拾獲物</div></div></div>
        <div class="stat-box"><span class="sb-icon">🔍</span><div><div class="sb-val">${items.filter(i=>i.status==='searching').length}</div><div class="sb-label">尋找中</div></div></div>
      `;

      if (q) items = items.filter(i => i.title.toLowerCase().includes(q) || (i.location||'').toLowerCase().includes(q) || (i.desc||'').toLowerCase().includes(q));
      if (filterType) items = items.filter(i => i.type === filterType);
      if (filterCat) items = items.filter(i => i.category === filterCat);
      if (filterStatus) items = items.filter(i => i.status === filterStatus);

      const col = document.getElementById('cards-col');
      if (!items.length) {
        col.innerHTML = '<div class="empty"><div class="empty-emoji">🌌</div><div>找不到符合的物品</div></div>';
        return;
      }
      col.innerHTML = items.slice().reverse().map(item => `
        <a class="card" href="detail.html?id=${item.id}">
          <div class="card-top">
            <div class="card-badges">
              <span class="badge ${item.type==='lost'?'badge-lost':'badge-found'}">${item.type==='lost'?'遺失':'拾獲'}</span>
              <span class="badge badge-cat">${item.category}</span>
            </div>
            <div class="card-title">${item.title}</div>
            ${item.desc ? `<div class="card-desc">${item.desc}</div>` : ''}
            <div class="card-meta">
              <span>📍 ${item.location}</span>
              <span>📅 ${item.time}</span>
            </div>
          </div>
          <div class="card-footer">
            <div class="status-dot-row">
              <div class="dot ${item.status==='done'?'dot-done':'dot-searching'}"></div>
              <span style="color:${item.status==='done'?'var(--found-color)':'#ef4444'}">${item.status==='done'?'已找到':'尋找中'}</span>
            </div>
            <div class="card-icon">${EMOJI[item.category]||'📦'}</div>
          </div>
        </a>
      `).join('');
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('open');
    }

    seedData();

    const user = JSON.parse(localStorage.getItem('lf_current_user') || 'null');
    if (user) {
      document.getElementById('sidebar-username').textContent = user.name;
      document.querySelector('.user-action').innerHTML = `<button onclick="logout()" style="background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;padding:0">登出</button>`;
    }
    function logout() { localStorage.removeItem('lf_current_user'); location.reload(); }

    renderCards();
  </script>
</body>
</html>
